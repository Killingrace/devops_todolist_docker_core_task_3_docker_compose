version: '3'

networks:
  todo-network:
    driver: bridge

services:

  todo-app:
    image: todo-app-image:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-app
    networks:
      - todo-network
    ports:
      - "8080:8080"
    depends_on:
      - todo-db
    restart: unless-stopped

  todo-db:
    image: mysql:latest
    container_name: todo-db
    networks:
      - todo-network
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    volumes:
      - todo-volume:/var/lib/mysql

volumes:
  todo-volume:
    driver: local
